# SQL Server 2022 for the SQL course. start.command creates MyDatabase and SalesDB on the first start.
# Double-click start.command on a Mac; this file is what it runs.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sql-course
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlServer!2026"
    ports:
      - "1433:1433"
    volumes:
      - sql-course-data:/var/opt/mssql
volumes:
  sql-course-data:
